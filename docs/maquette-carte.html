<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette — carte au trésor en perspective</title>
<!-- Maquette de discussion pour l'issue #96.
     Deux vues : l'archipel, puis le ZOOM DANS une île où chaque jeu est un LIEU du décor.
     Direction artistique : vue 3/4, îles à falaise posées sur l'eau, volumes à trois tons
     (dessus clair / flanc moyen / ombre), lumière constante en haut à gauche.
     Vraies couleurs et vraies polices du projet. Rien ici n'est du code de production. -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  body { margin: 0; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: var(--space-4) var(--gutter) var(--space-7); }
  .note { color: var(--ink-soft); font-size: var(--text-s); text-align: center; margin: 0 0 var(--space-3); }
  .bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); min-height: 56px; }
  .bar h1 { margin: 0; font-size: var(--text-xl); color: var(--ink); }
  .back { display: none; align-items: center; gap: var(--space-2); min-height: 56px; padding: 0 var(--space-4);
          font-family: var(--font-title); font-weight: 600; font-size: 1.1rem; color: var(--ink);
          background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-round);
          box-shadow: 0 3px 0 var(--border); cursor: pointer; }
  body[data-view="isle"] .back { display: inline-flex; }
  svg.scene { display: block; width: 100%; height: auto; border-radius: var(--radius-l);
              border: 2px solid var(--rule-strong); }
  body[data-view="world"] #isle, body[data-view="isle"] #world { display: none; }

  /* ---- Eau : trois profondeurs, du large vers les hauts-fonds ---- */
  .w-far  { fill: var(--kawaii-ciel-deep); }
  .w-mid  { fill: var(--kawaii-ciel); }
  .w-near { fill: var(--surface-raised); opacity: .5; }
  .foam   { fill: none; stroke: var(--surface-raised); stroke-width: 2.4; stroke-linecap: round; opacity: .9; }
  /* Ondes autour d'une île : des traits fins, sinon ce sont des cerceaux. */
  .ripple { fill: none; stroke: var(--surface-raised); stroke-width: .9; }

  /* ---- Volumes : dessus clair, flanc moyen, ombre. Lumière en haut à gauche. ---- */
  .top-grass  { fill: var(--kawaii-menthe); }
  .top-grass2 { fill: var(--kawaii-menthe-deep); opacity: .38; }
  .side-rock  { fill: var(--kawaii-creme-deep); }
  .under-rock { fill: var(--kawaii-lavande-deep); opacity: .85; }
  .sand-top   { fill: var(--kawaii-creme); }
  .cast       { fill: var(--kawaii-shadow); }

  .trunk { fill: var(--kawaii-peche-deep); }
  .leaf-dark { fill: var(--kawaii-menthe-deep); }
  .leaf-lit  { fill: var(--kawaii-menthe); }

  .wall-lit  { fill: var(--kawaii-creme); }
  .wall-dim  { fill: var(--kawaii-creme-deep); }
  .roof-lit  { fill: var(--island, var(--island-mots)); }
  .roof-dim  { fill: var(--island-ink, var(--island-mots-ink)); opacity: .85; }

  .path-base { fill: none; stroke: var(--kawaii-creme-deep); stroke-width: 7; stroke-linecap: round; opacity: .5; }
  .path-top  { fill: none; stroke: var(--kawaii-creme); stroke-width: 4.4; stroke-linecap: round;
               stroke-dasharray: .1 7; }

  /* ---- Lieux et îles cliquables ---- */
  .spot, .isle-hit { cursor: pointer; }
  .spot:focus, .isle-hit:focus { outline: none; }
  .halo { fill: none; stroke: var(--surface-raised); stroke-width: 3.4; opacity: 0; }
  .spot:hover .halo, .spot:focus .halo, .isle-hit:hover .halo, .isle-hit:focus .halo { opacity: .95; }

  .plaque      { fill: var(--surface-raised); stroke: var(--border); stroke-width: .8; }
  .plaque-shadow { fill: var(--kawaii-shadow); }
  .spot-label  { font-family: var(--font-title); font-weight: 600; font-size: 4.6px; fill: var(--ink); }
  .spot-stars  { font-size: 4px; fill: var(--ink-soft); font-family: var(--font-text); }
  .locked .plaque { fill: var(--surface-sunk); }
  .locked .spot-label { fill: var(--ink-faint); }

  .isle-name { font-family: var(--font-title); font-weight: 600; font-size: 6.4px; }
  .isle-meta { font-family: var(--font-text); font-size: 4.2px; fill: var(--ink-soft); }
  /* Brume : les îles lointaines sont plus pâles — c'est ce qui crée la distance. */
  .hazed { opacity: .5; }
</style>
</head>
<body data-view="world">
<div class="wrap">
  <p class="note">Maquette — vue 3/4, volumes à trois tons. Touche une île, puis un lieu.</p>

  <div class="bar">
    <button class="back" type="button" onclick="toWorld()">← La carte</button>
    <h1 id="title">Choisis une île</h1>
  </div>

  <!-- ========================= L'ARCHIPEL ========================= -->
  <svg id="world" class="scene" viewBox="0 0 220 130" role="img" aria-labelledby="wt wd">
    <title id="wt">Carte de l'archipel</title>
    <desc id="wd">Cinq îles à falaise posées sur la mer, vues de trois quarts. L'île aux Mots et
      l'île aux Nombres sont ouvertes ; les trois autres sont plus loin, dans la brume.</desc>

    <defs>
      <!-- Un arbre : boule éclairée à gauche, flanc sombre à droite, ombre au sol. -->
      <g id="tree">
        <ellipse class="cast" cx="0" cy="1" rx="4.6" ry="1.5"/>
        <rect class="trunk" x="-1" y="-5" width="2" height="6" rx="1"/>
        <circle class="leaf-dark" cx="0" cy="-7.5" r="5"/>
        <circle class="leaf-lit" cx="-1.6" cy="-8.8" r="3.2"/>
      </g>
    </defs>

    <rect class="w-far" x="0" y="0" width="220" height="130"/>
    <!-- L'eau s'éclaircit vers nous, en nappes aux bords souples : aucune ligne droite,
         sinon on voit le procédé au lieu de voir la mer. -->
    <path class="w-mid" d="M0 52q40-14 78-6t72 10 70-10v84H0Z" opacity=".55"/>
    <path class="w-near" d="M0 92q46-12 86-4t64 6 70-8v44H0Z"/>
    <!-- Ondes concentriques : elles posent chaque île sur l'eau. -->
    <ellipse class="ripple" cx="64" cy="98" rx="52" ry="15" opacity=".35"/>
    <ellipse class="ripple" cx="64" cy="101" rx="62" ry="18" opacity=".2"/>
    <ellipse class="ripple" cx="146" cy="74" rx="36" ry="11" opacity=".3"/>
    <ellipse class="ripple" cx="146" cy="77" rx="44" ry="13" opacity=".16"/>

    <!-- ===== Îles lointaines (petites, pâles, hautes dans l'image) ===== -->
    <g class="isle-hit hazed" tabindex="0" role="link" aria-label="L'île d'Ailleurs, verrouillée, encore 15 étoiles.">
      <ellipse class="cast" cx="36" cy="36" rx="19" ry="4"/>
      <path class="under-rock" d="M20 32q5 12 16 13t16-13q-6 6-16 6t-16-6Z"/>
      <path class="side-rock" d="M19 29a17 6 0 0 0 34 0v5a17 6 0 0 1-34 0Z"/>
      <ellipse class="sand-top" cx="36" cy="29" rx="17" ry="6"/>
      <ellipse class="top-grass" cx="36" cy="28" rx="13.5" ry="4.4"/>
      <text class="isle-name" x="36" y="17" text-anchor="middle" fill="var(--ink-faint)">L'île d'Ailleurs</text>
      <text class="isle-meta" x="36" y="47" text-anchor="middle">🔒 encore 15 ⭐</text>
    </g>

    <g class="isle-hit hazed" tabindex="0" role="link" aria-label="L'île des Mesures, verrouillée, encore 3 étoiles.">
      <ellipse class="cast" cx="180" cy="46" rx="21" ry="4.4"/>
      <path class="under-rock" d="M162 42q6 13 18 14t18-14q-7 7-18 7t-18-7Z"/>
      <path class="side-rock" d="M161 38a19 6.6 0 0 0 38 0v5.5a19 6.6 0 0 1-38 0Z"/>
      <ellipse class="sand-top" cx="180" cy="38" rx="19" ry="6.6"/>
      <ellipse class="top-grass" cx="180" cy="37" rx="15" ry="5"/>
      <text class="isle-name" x="180" y="25" text-anchor="middle" fill="var(--ink-faint)">L'île des Mesures</text>
      <text class="isle-meta" x="180" y="58" text-anchor="middle">🔒 encore 3 ⭐</text>
    </g>

    <!-- ===== Île aux Nombres : plan intermédiaire ===== -->
    <g class="isle-hit" tabindex="0" role="link" aria-label="L'île aux Nombres, nombres et calcul, 4 étoiles sur 36. Ouverte.">
      <ellipse class="cast" cx="146" cy="84" rx="30" ry="6"/>
      <path class="foam" d="M118 78a28 9 0 0 0 56 0" opacity=".55"/>
      <path class="under-rock" d="M120 76q9 19 26 20t26-20q-10 10-26 10t-26-10Z"/>
      <path class="side-rock" d="M119 70a27 9 0 0 0 54 0v8a27 9 0 0 1-54 0Z"/>
      <ellipse class="sand-top" cx="146" cy="70" rx="27" ry="9"/>
      <ellipse class="top-grass" cx="146" cy="68" rx="22" ry="7"/>
      <path class="top-grass2" d="M128 69q10-5 20-4t16 5q-10 4-20 4t-16-5Z"/>
      <!-- un pic rocheux, pour la silhouette -->
      <path class="under-rock" d="M150 64l7-12 7 12Z" opacity=".55"/>
      <path class="side-rock" d="M157 52l7 12h-7Z"/>
      <use href="#tree" x="132" y="68" transform="scale(.8) translate(33 17)"/>
      <circle class="halo" cx="146" cy="70" r="30"/>
      <text class="isle-name" x="146" y="50" text-anchor="middle" fill="var(--island-nombres-ink)">L'île aux Nombres</text>
      <text class="isle-meta" x="146" y="94" text-anchor="middle">⭐ 4/36 · 🌼 1/10</text>
    </g>

    <!-- ===== Île aux Mots : premier plan, la plus grande et la plus saturée ===== -->
    <g class="isle-hit" tabindex="0" role="link"
       aria-label="L'île aux Mots, français, 12 étoiles sur 54, 3 gommettes sur 10. Ouverte."
       onclick="toIsle()" onkeypress="if(event.key==='Enter')toIsle()">
      <ellipse class="cast" cx="64" cy="112" rx="42" ry="7"/>
      <path class="foam" d="M24 104a40 12 0 0 0 80 0"/>
      <path class="under-rock" d="M26 100q12 26 38 27t38-27q-14 13-38 13t-38-13Z"/>
      <path class="side-rock" d="M24 92a40 12 0 0 0 80 0v10a40 12 0 0 1-80 0Z"/>
      <ellipse class="sand-top" cx="64" cy="92" rx="40" ry="12"/>
      <ellipse class="top-grass" cx="64" cy="89" rx="33" ry="9.6"/>
      <path class="top-grass2" d="M38 90q14-7 28-6t22 7q-14 6-28 6t-22-7Z"/>
      <use href="#tree" x="42" y="90"/>
      <use href="#tree" x="88" y="92" transform="scale(.85) translate(15 14)"/>
      <!-- un toit dépasse : on devine qu'il y a des lieux à visiter -->
      <path class="wall-lit" d="M62 86h9v6h-9Z"/>
      <path class="wall-dim" d="M71 86h3v6h-3Z"/>
      <path class="roof-lit" d="M60 86l6.5-6 6.5 6Z" style="--island: var(--island-mots)"/>
      <circle class="halo" cx="64" cy="92" r="43"/>
      <text class="isle-name" x="64" y="66" text-anchor="middle" fill="var(--island-mots-ink)">L'île aux Mots</text>
      <text class="isle-meta" x="64" y="124" text-anchor="middle">⭐ 12/54 · 🌼 3/10</text>
    </g>

    <g class="isle-hit hazed" tabindex="0" role="link" aria-label="L'île du Monde, verrouillée, encore 9 étoiles.">
      <ellipse class="cast" cx="140" cy="118" rx="22" ry="4.6"/>
      <path class="under-rock" d="M122 114q7 14 18 15t18-15q-7 7-18 7t-18-7Z"/>
      <path class="side-rock" d="M121 110a19 6.6 0 0 0 38 0v5.5a19 6.6 0 0 1-38 0Z"/>
      <ellipse class="sand-top" cx="140" cy="110" rx="19" ry="6.6"/>
      <ellipse class="top-grass" cx="140" cy="109" rx="15" ry="5"/>
      <text class="isle-name" x="140" y="101" text-anchor="middle" fill="var(--ink-faint)">L'île du Monde</text>
      <text class="isle-meta" x="140" y="128" text-anchor="middle">🔒 encore 9 ⭐</text>
    </g>
  </svg>

  <!-- ========================= ZOOM : L'ÎLE AUX MOTS ========================= -->
  <svg id="isle" class="scene" viewBox="0 0 220 142" role="img" aria-labelledby="it id"
       style="--island: var(--island-mots); --island-ink: var(--island-mots-ink);">
    <title id="it">L'île aux Mots</title>
    <desc id="id">L'île vue de trois quarts. Six lieux à visiter librement : la grotte des Sons,
      le moulin des Syllabes, les rochers Jumeaux, l'arbre qui change, le phare de la Lecture
      éclair et la cabane aux Devinettes.</desc>

    <defs>
      <g id="tree2">
        <ellipse class="cast" cx="0" cy="1" rx="5" ry="1.6"/>
        <rect class="trunk" x="-1.1" y="-6" width="2.2" height="7" rx="1.1"/>
        <circle class="leaf-dark" cx="0" cy="-9" r="5.6"/>
        <circle class="leaf-lit" cx="-1.8" cy="-10.4" r="3.6"/>
      </g>
      <g id="bush">
        <ellipse class="cast" cx="0" cy="1" rx="3.4" ry="1.1"/>
        <circle class="leaf-dark" cx="0" cy="-2" r="3.2"/>
        <circle class="leaf-lit" cx="-1" cy="-2.8" r="1.9"/>
      </g>
    </defs>

    <rect class="w-far" x="0" y="0" width="220" height="142"/>
    <path class="w-mid" d="M0 38q44-14 84-6t66 8 70-10v112H0Z" opacity=".6"/>
    <path class="w-near" d="M0 110q50-12 90-4t62 6 68-10v40H0Z"/>
    <ellipse class="ripple" cx="110" cy="100" rx="108" ry="30" opacity=".35"/>
    <ellipse class="ripple" cx="110" cy="105" rx="122" ry="35" opacity=".18"/>

    <!-- Le socle de l'île : ombre, dessous rocheux, falaise, plage, herbe -->
    <ellipse class="cast" cx="110" cy="126" rx="96" ry="10"/>
    <path class="under-rock" d="M18 104q24 34 92 36t92-36q-30 20-92 20t-92-20Z"/>
    <path class="side-rock" d="M14 86a96 26 0 0 0 192 0v18a96 26 0 0 1-192 0Z"/>
    <ellipse class="sand-top" cx="110" cy="86" rx="96" ry="26"/>
    <ellipse class="top-grass" cx="110" cy="82" rx="84" ry="21"/>
    <path class="top-grass2" d="M38 84q34-14 72-12t68 14q-34 12-70 12t-70-14Z"/>

    <!-- Relief du fond : deux collines en volume -->
    <path class="under-rock" d="M60 70q16-26 32 0Z" opacity=".5"/>
    <path class="side-rock" d="M76 56q16 0 16 14H76Z"/>
    <path class="under-rock" d="M140 72q13-20 26 0Z" opacity=".5"/>
    <path class="side-rock" d="M153 60q13 0 13 12h-13Z"/>

    <!-- Le chemin : une bande claire posée sur l'herbe, pas une ligne -->
    <path class="path-base" d="M48 96 C 70 104, 72 76, 96 72 S 128 86, 150 74 S 182 70, 190 92"/>
    <path class="path-top"  d="M48 96 C 70 104, 72 76, 96 72 S 128 86, 150 74 S 182 70, 190 92"/>

    <use href="#tree2" x="34" y="88"/>
    <use href="#tree2" x="196" y="86" transform="scale(.9) translate(22 10)"/>
    <use href="#bush" x="118" y="96"/>
    <use href="#bush" x="70" y="66"/>
    <use href="#tree2" x="124" y="100" transform="scale(.75) translate(41 33)"/>

    <!-- ========== LES SIX LIEUX ========== -->

    <!-- 1 · La grotte des Sons -->
    <g class="spot" tabindex="0" role="link" aria-label="Les sons, la grotte des échos, 6 étoiles sur 9.">
      <circle class="halo" cx="48" cy="92" r="15"/>
      <path class="under-rock" d="M34 94q3-18 14-18t14 18Z"/>
      <path class="side-rock" d="M38 94q2-13 10-13t10 13Z"/>
      <path d="M42 94q1.4-9 6-9t6 9Z" fill="var(--kawaii-ink)" opacity=".8"/>
      <ellipse class="plaque-shadow" cx="48" cy="107" rx="18" ry="5"/>
      <rect class="plaque" x="30" y="97" width="36" height="12" rx="6"/>
      <text class="spot-label" x="48" y="102.4" text-anchor="middle">Les sons</text>
      <text class="spot-stars" x="48" y="107" text-anchor="middle">⭐⭐⭐ 6/9</text>
    </g>

    <!-- 2 · Le moulin des Syllabes -->
    <g class="spot" tabindex="0" role="link" aria-label="Syllabes en folie, le moulin, 3 étoiles sur 9.">
      <circle class="halo" cx="96" cy="66" r="15"/>
      <ellipse class="cast" cx="96" cy="73" rx="9" ry="2.4"/>
      <path class="wall-lit" d="M91 58h7v15h-7Z"/>
      <path class="wall-dim" d="M98 58h4v15h-4Z"/>
      <path class="roof-lit" d="M88 58l8.5-9 8.5 9Z"/>
      <path class="roof-dim" d="M96.5 49l8.5 9h-4Z"/>
      <g stroke="var(--island-ink)" stroke-width="1.4" stroke-linecap="round">
        <path d="M96 52l7-6"/><path d="M96 52l-7-6"/><path d="M96 52l6 7"/><path d="M96 52l-6 7"/>
      </g>
      <ellipse class="plaque-shadow" cx="96" cy="84" rx="19" ry="5"/>
      <rect class="plaque" x="77" y="74" width="38" height="12" rx="6"/>
      <text class="spot-label" x="96" y="79.4" text-anchor="middle">Syllabes</text>
      <text class="spot-stars" x="96" y="84" text-anchor="middle">⭐ 3/9</text>
    </g>

    <!-- 3 · Les rochers Jumeaux -->
    <g class="spot" tabindex="0" role="link" aria-label="Lettres sœurs, les rochers jumeaux, 3 étoiles sur 9.">
      <circle class="halo" cx="150" cy="70" r="15"/>
      <ellipse class="cast" cx="150" cy="78" rx="12" ry="2.6"/>
      <path class="under-rock" d="M140 78q2-14 7-14t7 14Z"/>
      <path class="side-rock" d="M143 78q1.6-10 4-10t4 10Z"/>
      <path class="under-rock" d="M150 78q2-17 8-17t8 17Z"/>
      <path class="side-rock" d="M153 78q1.8-12 5-12t5 12Z"/>
      <ellipse class="plaque-shadow" cx="152" cy="89" rx="21" ry="5"/>
      <rect class="plaque" x="131" y="79" width="42" height="12" rx="6"/>
      <text class="spot-label" x="152" y="84.4" text-anchor="middle">Lettres sœurs</text>
      <text class="spot-stars" x="152" y="89" text-anchor="middle">⭐ 3/9</text>
    </g>

    <!-- 4 · L'arbre qui change -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Les lettres qui changent de son, l'arbre qui change, jamais joué.">
      <circle class="halo" cx="118" cy="48" r="14"/>
      <ellipse class="cast" cx="118" cy="58" rx="6" ry="1.8"/>
      <rect class="trunk" x="116.8" y="48" width="2.4" height="10" rx="1.2"/>
      <path d="M118 48a8 8 0 0 1 0-16Z" fill="var(--kawaii-menthe-deep)"/>
      <path d="M118 48a8 8 0 0 0 0-16Z" fill="var(--kawaii-peche-deep)"/>
      <circle cx="115.4" cy="37" r="2.4" fill="var(--kawaii-menthe)"/>
      <circle cx="120.6" cy="37" r="2.4" fill="var(--kawaii-peche)"/>
      <ellipse class="plaque-shadow" cx="118" cy="68" rx="25" ry="5"/>
      <rect class="plaque" x="93" y="58" width="50" height="12" rx="6"/>
      <text class="spot-label" x="118" y="63.4" text-anchor="middle">Lettres qui changent</text>
      <text class="spot-stars" x="118" y="68" text-anchor="middle">à découvrir</text>
    </g>

    <!-- 5 · Le phare de la Lecture éclair -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Lecture éclair, le phare, jamais joué.">
      <circle class="halo" cx="190" cy="88" r="15"/>
      <ellipse class="cast" cx="190" cy="95" rx="8" ry="2.2"/>
      <path class="wall-lit" d="M187 95l2-22h2l2 22Z"/>
      <path class="wall-dim" d="M191 73h1l2 22h-3Z"/>
      <rect x="187.4" y="78" width="5.2" height="3.4" fill="var(--island)"/>
      <circle cx="190" cy="70" r="3" fill="var(--kawaii-citron)" stroke="var(--kawaii-citron-deep)" stroke-width=".7"/>
      <path d="M193 68l8-3M193 72l8 3" stroke="var(--kawaii-citron-deep)" stroke-width="1" stroke-linecap="round"/>
      <ellipse class="plaque-shadow" cx="188" cy="106" rx="21" ry="5"/>
      <rect class="plaque" x="167" y="96" width="42" height="12" rx="6"/>
      <text class="spot-label" x="188" y="101.4" text-anchor="middle">Lecture éclair</text>
      <text class="spot-stars" x="188" y="106" text-anchor="middle">à découvrir</text>
    </g>

    <!-- 6 · La cabane aux Devinettes -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Devinettes, la cabane, jamais joué.">
      <circle class="halo" cx="74" cy="108" r="14"/>
      <ellipse class="cast" cx="74" cy="114" rx="9" ry="2.4"/>
      <path class="wall-lit" d="M69 104h8v10h-8Z"/>
      <path class="wall-dim" d="M77 104h4v10h-4Z"/>
      <path class="roof-lit" d="M66 104l8.5-7 8.5 7Z"/>
      <path class="roof-dim" d="M74.5 97l8.5 7h-4Z"/>
      <text x="73" y="112" text-anchor="middle" font-size="6" font-family="var(--font-title)" font-weight="600" fill="var(--island-ink)">?</text>
      <ellipse class="plaque-shadow" cx="74" cy="126" rx="19" ry="5"/>
      <rect class="plaque" x="55" y="116" width="38" height="12" rx="6"/>
      <text class="spot-label" x="74" y="121.4" text-anchor="middle">Devinettes</text>
      <text class="spot-stars" x="74" y="126" text-anchor="middle">à découvrir</text>
    </g>

    <!-- La mascotte de l'île, posée au sol avec son ombre -->
    <g aria-hidden="true" transform="translate(108 -8)">
