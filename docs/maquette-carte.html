<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette — une vraie carte au trésor</title>
<!-- Maquette de discussion pour l'issue « la carte des îles n'est pas une carte ».
     Elle réutilise les vrais tokens du projet : les couleurs sont donc exactes, en clair
     comme en sombre. Rien ici n'est du code de production. -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  body { margin: 0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: var(--space-4) var(--gutter) var(--space-7); }
  .note { color: var(--ink-soft); font-size: var(--text-s); text-align: center; margin: 0 0 var(--space-4); }

  /* La carte : un seul SVG qui se met à l'échelle. Le ratio change sur téléphone (route
     verticale) et sur grand écran (archipel large) — ici la version large. */
  .map { display: block; width: 100%; height: auto; border-radius: var(--radius-l);
         border: 2px solid var(--rule-strong); background: var(--surface); }

  .sea { fill: var(--surface-sunk); }
  .wave { stroke: var(--rule-strong); stroke-width: .5; fill: none; opacity: .7; }
  .route { stroke: var(--ink-faint); stroke-width: 1.1; stroke-dasharray: 3 3.5;
           stroke-linecap: round; fill: none; }
  .isle-shadow { fill: var(--shadow); opacity: .18; }
  .isle-name { font-family: var(--font-title); font-weight: 600; font-size: 5px; fill: var(--ink); }
  .isle-meta { font-family: var(--font-text); font-size: 3.6px; fill: var(--ink-soft); }
  .isle-hit { cursor: pointer; }
  .isle-hit:focus { outline: 3px solid var(--focus, var(--primary)); outline-offset: 2px; }
  .locked .isle-body { fill: var(--surface-sunk); stroke: var(--border); }
  .locked .isle-name, .locked .isle-meta { fill: var(--ink-faint); }
  .chest { font-size: 7px; }
  .flag { stroke: var(--ink); stroke-width: .7; }

  /* Le panneau n'apparaît qu'après avoir choisi une île : c'est ce qui distingue une carte
     d'un catalogue. */
  .panel { margin-top: var(--space-4); padding: var(--space-4);
           background: var(--island-soft); border: 2px solid var(--island);
           border-radius: var(--radius-l); }
  .panel h2 { margin: 0 0 var(--space-1); color: var(--island-ink); font-size: var(--text-l); }
  .panel p { margin: 0 0 var(--space-3); color: var(--ink-soft); font-size: var(--text-s); }
  .games { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .game { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2);
          min-height: 56px; padding: var(--space-2) var(--space-3); background: var(--surface);
          border: 2px solid var(--island); border-radius: var(--radius-m);
          color: var(--island-ink); font-family: var(--font-title); font-weight: 600; }
  .empty { color: var(--ink-faint); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <p class="note">Maquette de discussion — couleurs et polices réelles du projet. Touche une île.</p>

  <svg class="map" viewBox="0 0 160 96" role="img" aria-labelledby="t d">
    <title id="t">Carte au trésor des cinq îles</title>
    <desc id="d">Une mer parcourue d'une route en pointillés qui relie l'île aux Mots, l'île aux
      Nombres, l'île des Mesures, l'île du Monde et l'île d'Ailleurs. Les trois dernières sont
      encore dans la brume.</desc>

    <rect class="sea" x="0" y="0" width="160" height="96"/>
    <path class="wave" d="M6 14q5-3 10 0t10 0"/>
    <path class="wave" d="M128 10q5-3 10 0t10 0"/>
    <path class="wave" d="M14 84q5-3 10 0t10 0"/>
    <path class="wave" d="M118 88q5-3 10 0t10 0"/>

    <!-- La route : c'est elle qui raconte la progression. -->
    <path class="route" d="M34 62 C 56 70, 62 36, 84 34 S 118 30, 128 56 S 112 84, 92 78"/>

    <!-- Île aux Mots (ouverte, en cours) -->
    <g class="isle-hit" tabindex="0" role="link" aria-label="L'île aux Mots, français, 12 étoiles sur 54, 3 gommettes sur 10. Ouverte.">
      <ellipse class="isle-shadow" cx="30" cy="68" rx="20" ry="4"/>
      <path class="isle-body" d="M14 62q2-10 11-12t13 3 8 10-6 9-15 2-11-12Z"
            fill="var(--island-mots-soft)" stroke="var(--island-mots)" stroke-width="1.4"/>
      <text class="isle-name" x="30" y="45" text-anchor="middle" fill="var(--island-mots-ink)">L'île aux Mots</text>
      <text class="isle-meta" x="30" y="66" text-anchor="middle">⭐ 12/54 · 🌼 3/10</text>
    </g>

    <!-- Île aux Nombres (ouverte) -->
    <g class="isle-hit" tabindex="0" role="link" aria-label="L'île aux Nombres, nombres et calcul, 4 étoiles sur 36. Ouverte.">
      <ellipse class="isle-shadow" cx="84" cy="42" rx="17" ry="3.4"/>
      <path class="isle-body" d="M70 37q3-9 12-10t12 4 5 9-7 7-15 1-7-11Z"
            fill="var(--island-nombres-soft)" stroke="var(--island-nombres)" stroke-width="1.4"/>
      <text class="isle-name" x="84" y="21" text-anchor="middle" fill="var(--island-nombres-ink)">L'île aux Nombres</text>
      <text class="isle-meta" x="84" y="41" text-anchor="middle">⭐ 4/36 · 🌼 1/10</text>
    </g>

    <!-- Le coffre du jour : un point d'intérêt sur la route, pas une carte de plus. -->
    <g class="isle-hit" tabindex="0" role="link" aria-label="Défi du jour, cinq questions mélangées.">
      <text class="chest" x="58" y="56" text-anchor="middle">🗝️</text>
      <text class="isle-meta" x="58" y="63" text-anchor="middle">Défi du jour</text>
    </g>

    <!-- Îles encore dans la brume -->
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île des Mesures, verrouillée, encore 3 étoiles.">
      <path class="isle-body" d="M118 62q3-8 11-9t11 4 4 8-7 6-13 1-6-10Z" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text class="isle-name" x="129" y="53" text-anchor="middle">L'île des Mesures</text>
      <text class="isle-meta" x="129" y="68" text-anchor="middle">🔒 encore 3 ⭐</text>
    </g>
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île du Monde, verrouillée, encore 9 étoiles.">
      <path class="isle-body" d="M82 80q3-7 10-8t10 4 3 7-7 5-11 1-5-9Z" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text class="isle-name" x="92" y="72" text-anchor="middle">L'île du Monde</text>
      <text class="isle-meta" x="92" y="86" text-anchor="middle">🔒 encore 9 ⭐</text>
    </g>
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île d'Ailleurs, verrouillée, encore 15 étoiles.">
      <path class="isle-body" d="M26 24q3-7 10-8t10 4 3 7-7 5-11 1-5-9Z" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text class="isle-name" x="36" y="16" text-anchor="middle">L'île d'Ailleurs</text>
      <text class="isle-meta" x="36" y="30" text-anchor="middle">🔒 encore 15 ⭐</text>
    </g>
  </svg>

  <!-- Au clic sur une île : ses jeux, et eux seuls. -->
  <section class="panel" data-island="mots">
    <h2>L'île aux Mots</h2>
    <p>Français · 12 étoiles sur 54 · 3 gommettes sur 10</p>
    <div class="games">
      <div class="game"><span>Les sons</span><span>⭐ 6/9</span></div>
      <div class="game"><span>Syllabes en folie</span><span>⭐ 3/9</span></div>
      <div class="game"><span>Lettres sœurs</span><span>⭐ 3/9</span></div>
      <div class="game"><span>Les lettres qui changent</span><span>⭐ 0/9</span></div>
      <div class="game"><span>Lecture éclair</span><span>⭐ 0/9</span></div>
      <div class="game"><span>Devinettes</span><span>⭐ 0/9</span></div>
    </div>
  </section>
</div>
</body>
</html>
