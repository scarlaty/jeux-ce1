<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette — carte au trésor et zoom sur une île</title>
<!-- Maquette de discussion pour l'issue #96.
     Deux niveaux : l'archipel, puis le ZOOM dans une île où chaque jeu est un LIEU du décor.
     Elle réutilise les vrais tokens du projet (couleurs et polices exactes, clair et sombre).
     Rien ici n'est du code de production : c'est la direction artistique qu'on valide. -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  body { margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: var(--space-4) var(--gutter) var(--space-7); }
  .note { color: var(--ink-soft); font-size: var(--text-s); text-align: center; margin: 0 0 var(--space-3); }
  .bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); min-height: 56px; }
  .bar h1 { margin: 0; font-size: var(--text-xl); color: var(--island-ink, var(--ink)); }
  .back { display: none; align-items: center; gap: var(--space-2); min-height: 56px; padding: 0 var(--space-4);
          font-family: var(--font-title); font-weight: 600; font-size: 1.1rem; color: var(--ink);
          background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-round);
          box-shadow: 0 3px 0 var(--border); cursor: pointer; }
  body[data-view="isle"] .back { display: inline-flex; }

  svg.scene { display: block; width: 100%; height: auto; border-radius: var(--radius-l);
              border: 2px solid var(--rule-strong); }
  body[data-view="world"] #isle, body[data-view="isle"] #world { display: none; }

  /* --- Mer, ciel, terre : des aplats superposés donnent la profondeur, sans dégradé --- */
  .sea-deep   { fill: var(--kawaii-ciel-deep); }
  .sea-mid    { fill: var(--kawaii-ciel); }
  .surf       { fill: none; stroke: var(--surface-raised); stroke-width: 2.2; stroke-linecap: round; opacity: .85; }
  .sand       { fill: var(--kawaii-creme); }
  .sand-edge  { fill: var(--kawaii-creme-deep); }
  .grass      { fill: var(--kawaii-menthe); }
  .grass-dark { fill: var(--kawaii-menthe-deep); opacity: .45; }
  .rock       { fill: var(--kawaii-lavande); }
  .rock-dark  { fill: var(--kawaii-lavande-deep); opacity: .5; }
  .shadow     { fill: var(--kawaii-shadow); }
  .cloud      { fill: var(--surface-raised); opacity: .9; }
  .bird       { fill: none; stroke: var(--ink-soft); stroke-width: 1.1; stroke-linecap: round; }
  .trunk      { fill: var(--kawaii-peche-deep); }
  .leaf       { fill: var(--kawaii-menthe-deep); }
  .leaf-light { fill: var(--kawaii-menthe); }
  .path       { fill: none; stroke: var(--kawaii-creme-deep); stroke-width: 3.4;
                stroke-linecap: round; stroke-dasharray: 0.1 6; }

  /* --- Les lieux : un jeu = un endroit qu'on peut toucher --- */
  .spot { cursor: pointer; }
  .spot:focus { outline: none; }
  .spot:focus .halo, .spot:hover .halo { opacity: 1; }
  .halo { fill: none; stroke: var(--surface-raised); stroke-width: 3; opacity: 0; }
  .spot-label { font-family: var(--font-title); font-weight: 600; font-size: 4.4px; fill: var(--ink); }
  .spot-stars { font-size: 4px; fill: var(--ink-soft); font-family: var(--font-text); }
  .plaque { fill: var(--surface-raised); stroke: var(--border); stroke-width: .7; }
  .locked .plaque { fill: var(--surface-sunk); }
  .locked .spot-label { fill: var(--ink-faint); }

  .isle-name  { font-family: var(--font-title); font-weight: 600; font-size: 6px; }
  .isle-meta  { font-family: var(--font-text); font-size: 4px; fill: var(--ink-soft); }
  .isle-hit   { cursor: pointer; }
  .isle-hit:hover .isle-halo, .isle-hit:focus .isle-halo { opacity: .9; }
  .isle-halo  { fill: none; stroke: var(--surface-raised); stroke-width: 3; opacity: 0; }
  .fog        { fill: var(--surface-sunk); opacity: .72; }
  .fog-edge   { fill: none; stroke: var(--border); stroke-width: 1.4; stroke-dasharray: 3 3; }
</style>
</head>
<body data-view="world">
<div class="wrap">
  <p class="note">Maquette de discussion — vraies couleurs et vraies polices du projet. Touche une île, puis un lieu.</p>

  <div class="bar">
    <button class="back" type="button" onclick="document.body.dataset.view='world'">← La carte</button>
    <h1 id="title">Choisis une île</h1>
  </div>

  <!-- ====================== NIVEAU 1 : L'ARCHIPEL ====================== -->
  <svg id="world" class="scene" viewBox="0 0 200 118" role="img" aria-labelledby="wt wd">
    <title id="wt">Carte de l'archipel</title>
    <desc id="wd">Cinq îles posées sur la mer. L'île aux Mots et l'île aux Nombres sont ouvertes ;
      l'île des Mesures, l'île du Monde et l'île d'Ailleurs sont encore dans la brume.</desc>

    <rect class="sea-deep" x="0" y="0" width="200" height="118"/>
    <!-- Hauts-fonds : la mer s'éclaircit autour des terres. -->
    <ellipse class="sea-mid" cx="46" cy="72" rx="36" ry="24"/>
    <ellipse class="sea-mid" cx="128" cy="40" rx="34" ry="22"/>
    <ellipse class="sea-mid" cx="168" cy="86" rx="26" ry="17"/>
    <ellipse class="sea-mid" cx="96" cy="98" rx="24" ry="14"/>
    <ellipse class="sea-mid" cx="44" cy="22" rx="24" ry="14"/>

    <path class="surf" d="M14 60q6-4 12 0t12 0" opacity=".5"/>
    <path class="surf" d="M160 24q6-4 12 0t12 0" opacity=".5"/>
    <path class="surf" d="M22 104q6-4 12 0t12 0" opacity=".5"/>
    <g class="bird"><path d="M62 16q3-3 6 0"/><path d="M68 16q3-3 6 0"/></g>
    <g class="bird"><path d="M150 100q3-3 6 0"/></g>
    <ellipse class="cloud" cx="98" cy="16" rx="13" ry="5"/>
    <ellipse class="cloud" cx="106" cy="14" rx="9" ry="6"/>
    <ellipse class="cloud" cx="178" cy="54" rx="11" ry="4.5"/>

    <!-- ÎLE AUX MOTS — ouverte -->
    <g class="isle-hit" tabindex="0" role="link"
       aria-label="L'île aux Mots, français, 12 étoiles sur 54, 3 gommettes sur 10. Ouverte."
       onclick="openIsle()" onkeypress="if(event.key==='Enter')openIsle()">
      <ellipse class="shadow" cx="46" cy="86" rx="26" ry="5"/>
      <path class="isle-halo" d="M18 70q2-16 16-20t26 4 12 17-10 15-28 3-16-19Z"/>
      <path class="sand" d="M18 70q2-16 16-20t26 4 12 17-10 15-28 3-16-19Z"/>
      <path class="grass" d="M24 69q2-12 14-15t21 3 9 13-8 11-23 2-13-14Z"/>
      <path class="grass-dark" d="M30 64q5-6 13-5t12 5-9 5-16 0-0-5Z"/>
      <g><rect class="trunk" x="35" y="58" width="2" height="6" rx="1"/>
         <circle class="leaf" cx="36" cy="56" r="4.4"/><circle class="leaf-light" cx="34.5" cy="55" r="2.4"/></g>
      <g><rect class="trunk" x="55" y="62" width="2" height="5" rx="1"/>
         <circle class="leaf" cx="56" cy="60" r="3.6"/><circle class="leaf-light" cx="55" cy="59" r="2"/></g>
      <text class="isle-name" x="46" y="44" text-anchor="middle" fill="var(--island-mots-ink)">L'île aux Mots</text>
      <text class="isle-meta" x="46" y="95" text-anchor="middle">⭐ 12/54 · 🌼 3/10</text>
    </g>

    <!-- ÎLE AUX NOMBRES — ouverte -->
    <g class="isle-hit" tabindex="0" role="link" aria-label="L'île aux Nombres, nombres et calcul, 4 étoiles sur 36. Ouverte.">
      <ellipse class="shadow" cx="128" cy="53" rx="23" ry="4.5"/>
      <path class="sand" d="M104 39q3-14 15-17t23 4 10 15-10 13-25 2-13-17Z"/>
      <path class="grass" d="M110 38q3-10 12-13t18 3 8 11-8 10-20 2-10-13Z"/>
      <path class="rock" d="M120 30q6-9 12-1t-3 7-12-6Z"/>
      <path class="rock-dark" d="M126 28q4-5 6 0t-6 2Z"/>
      <g><rect class="trunk" x="138" y="38" width="2" height="5" rx="1"/>
         <circle class="leaf" cx="139" cy="36" r="3.6"/></g>
      <text class="isle-name" x="128" y="16" text-anchor="middle" fill="var(--island-nombres-ink)">L'île aux Nombres</text>
      <text class="isle-meta" x="128" y="62" text-anchor="middle">⭐ 4/36 · 🌼 1/10</text>
    </g>

    <!-- Îles encore dans la brume : on voit où l'on va, sans détail. -->
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île des Mesures, verrouillée, encore 3 étoiles.">
      <path class="fog" d="M150 86q3-12 14-14t20 4 8 12-9 11-21 2-12-15Z"/>
      <path class="fog-edge" d="M150 86q3-12 14-14t20 4 8 12-9 11-21 2-12-15Z"/>
      <text class="isle-name" x="168" y="68" text-anchor="middle" fill="var(--ink-faint)">L'île des Mesures</text>
      <text class="isle-meta" x="168" y="94" text-anchor="middle">🔒 encore 3 ⭐</text>
    </g>
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île du Monde, verrouillée, encore 9 étoiles.">
      <path class="fog" d="M82 98q3-10 12-11t17 3 7 10-8 9-18 2-10-13Z"/>
      <path class="fog-edge" d="M82 98q3-10 12-11t17 3 7 10-8 9-18 2-10-13Z"/>
      <text class="isle-name" x="97" y="84" text-anchor="middle" fill="var(--ink-faint)">L'île du Monde</text>
      <text class="isle-meta" x="97" y="112" text-anchor="middle">🔒 encore 9 ⭐</text>
    </g>
    <g class="isle-hit locked" tabindex="0" role="link" aria-label="L'île d'Ailleurs, verrouillée, encore 15 étoiles.">
      <path class="fog" d="M30 22q3-10 12-11t17 3 7 10-8 9-18 2-10-13Z"/>
      <path class="fog-edge" d="M30 22q3-10 12-11t17 3 7 10-8 9-18 2-10-13Z"/>
      <text class="isle-name" x="45" y="9" text-anchor="middle" fill="var(--ink-faint)">L'île d'Ailleurs</text>
      <text class="isle-meta" x="45" y="37" text-anchor="middle">🔒 encore 15 ⭐</text>
    </g>
  </svg>

  <!-- ====================== NIVEAU 2 : ZOOM DANS L'ÎLE ====================== -->
  <svg id="isle" class="scene" viewBox="0 0 200 128" role="img" aria-labelledby="it id"
       style="--island: var(--island-mots); --island-soft: var(--island-mots-soft); --island-ink: var(--island-mots-ink);">
    <title id="it">L'île aux Mots</title>
    <desc id="id">Six lieux posés sur l'île : la grotte des Sons, le moulin des Syllabes, les rochers
      Jumeaux, l'arbre qui change, le phare de la Lecture éclair et la cabane aux Devinettes.
      On peut aller où l'on veut.</desc>

    <rect class="sea-deep" x="0" y="0" width="200" height="128"/>
    <ellipse class="sea-mid" cx="100" cy="68" rx="96" ry="58"/>
    <path class="surf" d="M18 56q7-5 14 0t14 0"/>
    <path class="surf" d="M160 94q7-5 14 0t14 0"/>
    <g class="bird"><path d="M30 18q3.5-4 7 0"/><path d="M38 20q3.5-4 7 0"/></g>
    <ellipse class="cloud" cx="158" cy="18" rx="15" ry="5.5"/>
    <ellipse class="cloud" cx="168" cy="16" rx="10" ry="6.5"/>

    <!-- La terre : sable, herbe, reliefs -->
    <ellipse class="shadow" cx="100" cy="116" rx="74" ry="7"/>
    <path class="sand" d="M14 70q4-34 32-42t54-6 48 14 22 34-22 30-52 10-54-6-28-34Z"/>
    <path class="sand-edge" d="M14 70q4-34 32-42t54-6 48 14 22 34-22 30-52 10-54-6-28-34Z" opacity=".28"/>
    <path class="grass" d="M24 70q4-28 30-35t48-5 42 13 18 28-20 25-46 8-48-5-24-29Z"/>
    <path class="grass-dark" d="M40 44q16-10 40-9t42 10q-18 7-42 7t-40-8Z"/>
    <path class="grass-dark" d="M44 92q20 7 46 6t40-7q-18 10-44 11t-42-10Z"/>

    <!-- Collines au fond -->
    <path class="rock" d="M58 42q14-20 28-2t-28 2Z"/>
    <path class="rock-dark" d="M68 36q7-10 14-1t-14 1Z"/>
    <path class="rock" d="M120 44q11-16 22-2t-22 2Z"/>

    <!-- Le chemin relie les lieux sans imposer d'ordre : on va où l'on veut. -->
    <path class="path" d="M46 84 C 60 92, 64 62, 82 58 S 108 72, 124 60 S 150 52, 158 74"/>
    <path class="path" d="M82 58 C 88 44, 104 40, 112 44"/>

    <!-- Bosquets -->
    <g><rect class="trunk" x="35" y="60" width="2.4" height="8" rx="1.2"/>
       <circle class="leaf" cx="36" cy="57" r="6"/><circle class="leaf-light" cx="34" cy="55" r="3.2"/></g>
    <g><rect class="trunk" x="168" y="58" width="2.4" height="8" rx="1.2"/>
       <circle class="leaf" cx="169" cy="55" r="5.4"/><circle class="leaf-light" cx="167" cy="53" r="2.8"/></g>
    <g><rect class="trunk" x="100" y="96" width="2" height="6" rx="1"/>
       <circle class="leaf" cx="101" cy="94" r="4.4"/></g>
    <g><rect class="trunk" x="60" y="98" width="2" height="5" rx="1"/>
       <circle class="leaf" cx="61" cy="96" r="3.6"/></g>

    <!-- ---------- LES SIX LIEUX = LES SIX JEUX ---------- -->

    <!-- 1. La grotte des Sons -->
    <g class="spot" tabindex="0" role="link" aria-label="Les sons, la grotte des échos, 6 étoiles sur 9.">
      <circle class="halo" cx="46" cy="84" r="13"/>
      <path class="rock" d="M34 86q2-13 12-13t12 13Z"/>
      <path class="rock-dark" d="M40 86q1-7 6-7t6 7Z"/>
      <ellipse cx="46" cy="86" rx="4.6" ry="5.4" fill="var(--kawaii-ink)" opacity=".75"/>
      <rect class="plaque" x="29" y="92" width="34" height="11" rx="5.5"/>
      <text class="spot-label" x="46" y="97" text-anchor="middle">Les sons</text>
      <text class="spot-stars" x="46" y="101.5" text-anchor="middle">⭐⭐⭐ 6/9</text>
    </g>

    <!-- 2. Le moulin des Syllabes -->
    <g class="spot" tabindex="0" role="link" aria-label="Syllabes en folie, le moulin, 3 étoiles sur 9.">
      <circle class="halo" cx="82" cy="56" r="13"/>
      <rect x="78" y="52" width="8" height="12" rx="2" fill="var(--kawaii-creme)" stroke="var(--kawaii-creme-deep)" stroke-width=".8"/>
      <path d="M74 52h16l-8-7Z" fill="var(--island)"/>
      <g stroke="var(--island-ink)" stroke-width="1.2" stroke-linecap="round">
        <path d="M82 46l6-5"/><path d="M82 46l-6-5"/><path d="M82 46l5 6"/><path d="M82 46l-5 6"/>
      </g>
      <rect class="plaque" x="64" y="64" width="36" height="11" rx="5.5"/>
      <text class="spot-label" x="82" y="69" text-anchor="middle">Syllabes</text>
      <text class="spot-stars" x="82" y="73.5" text-anchor="middle">⭐ 3/9</text>
    </g>

    <!-- 3. Les rochers Jumeaux -->
    <g class="spot" tabindex="0" role="link" aria-label="Lettres sœurs, les rochers jumeaux, 3 étoiles sur 9.">
      <circle class="halo" cx="124" cy="58" r="13"/>
      <path class="rock" d="M116 62q2-10 6-10t6 10Z"/>
      <path class="rock" d="M124 62q2-12 7-12t7 12Z"/>
      <path class="rock-dark" d="M127 62q2-7 4-7t4 7Z"/>
      <rect class="plaque" x="106" y="63" width="38" height="11" rx="5.5"/>
      <text class="spot-label" x="125" y="68" text-anchor="middle">Lettres sœurs</text>
      <text class="spot-stars" x="125" y="72.5" text-anchor="middle">⭐ 3/9</text>
    </g>

    <!-- 4. L'arbre qui change de couleur -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Les lettres qui changent de son, l'arbre qui change, jamais joué.">
      <circle class="halo" cx="112" cy="42" r="12"/>
      <rect class="trunk" x="111" y="42" width="2.6" height="9" rx="1.3"/>
      <path d="M112 42a6 6 0 0 1 0-12Z" fill="var(--kawaii-menthe-deep)"/>
      <path d="M112 42a6 6 0 0 0 0-12Z" fill="var(--kawaii-peche-deep)"/>
      <rect class="plaque" x="90" y="51" width="45" height="11" rx="5.5"/>
      <text class="spot-label" x="112.5" y="56" text-anchor="middle">Lettres qui changent</text>
      <text class="spot-stars" x="112.5" y="60.5" text-anchor="middle">à découvrir</text>
    </g>

    <!-- 5. Le phare de la Lecture éclair -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Lecture éclair, le phare, jamais joué.">
      <circle class="halo" cx="158" cy="74" r="13"/>
      <path d="M155 80l1.6-14h2.8l1.6 14Z" fill="var(--surface-raised)" stroke="var(--border)" stroke-width=".7"/>
      <rect x="155.6" y="70" width="4.8" height="3" fill="var(--island)"/>
      <circle cx="158" cy="65" r="2.4" fill="var(--kawaii-citron)" stroke="var(--kawaii-citron-deep)" stroke-width=".6"/>
      <path d="M160 64l7-3M160 66l7 3" stroke="var(--kawaii-citron-deep)" stroke-width=".9" stroke-linecap="round"/>
      <rect class="plaque" x="140" y="80" width="38" height="11" rx="5.5"/>
      <text class="spot-label" x="159" y="85" text-anchor="middle">Lecture éclair</text>
      <text class="spot-stars" x="159" y="89.5" text-anchor="middle">à découvrir</text>
    </g>

    <!-- 6. La cabane aux Devinettes -->
    <g class="spot locked" tabindex="0" role="link" aria-label="Devinettes, la cabane, jamais joué.">
      <circle class="halo" cx="74" cy="96" r="12"/>
      <rect x="69" y="94" width="10" height="8" rx="1.6" fill="var(--kawaii-creme)" stroke="var(--kawaii-creme-deep)" stroke-width=".8"/>
      <path d="M66 94h16l-8-6Z" fill="var(--island)"/>
      <text x="74" y="100.5" text-anchor="middle" font-size="5" font-family="var(--font-title)" font-weight="600" fill="var(--island-ink)">?</text>
      <rect class="plaque" x="57" y="103" width="34" height="11" rx="5.5"/>
      <text class="spot-label" x="74" y="108" text-anchor="middle">Devinettes</text>
      <text class="spot-stars" x="74" y="112.5" text-anchor="middle">à découvrir</text>
    </g>

    <!-- La mascotte de l'île accueille ; le compagnon marque « tu es ici ». -->
    <g aria-hidden="true">
      <ellipse class="shadow" cx="122" cy="102" rx="7" ry="2"/>
      <path d="M122 86q9 0 9 9t-9 7-9-7 9-9Z" fill="var(--kawaii-rose)" stroke="var(--kawaii-rose-deep)" stroke-width="1"/>
      <circle cx="118.6" cy="95" r="1.2" fill="var(--kawaii-ink)"/>
      <circle cx="125.4" cy="95" r="1.2" fill="var(--kawaii-ink)"/>
      <path d="M120.6 98q1.4 1.4 2.8 0" stroke="var(--kawaii-ink)" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <circle cx="116.4" cy="97.4" r="1.4" fill="var(--kawaii-blush)" opacity=".55"/>
      <circle cx="127.6" cy="97.4" r="1.4" fill="var(--kawaii-blush)" opacity=".55"/>
    </g>
  </svg>

  <p class="note" style="margin-top: var(--space-3)">
    Libre parcours : le chemin relie les lieux sans en imposer l'ordre. Les lieux jamais joués gardent
    leur décor, marqués « à découvrir ».
  </p>
</div>

<script>
  function openIsle() {
    document.body.dataset.view = 'isle';
    document.getElementById('title').textContent = "L'île aux Mots";
    document.getElementById('title').style.color = 'var(--island-mots-ink)';
  }
  document.querySelector('.back').addEventListener('click', () => {
    document.getElementById('title').textContent = 'Choisis une île';
    document.getElementById('title').style.color = '';
  });
</script>
</body>
</html>
